# Passwords for the admin user and the database.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
type: Opaque
stringData:
  admin-username: {{ .Values.admin.username | quote }}
  admin-password: {{ .Values.admin.password | quote }}
  db-username: {{ .Values.database.username | quote }}
  db-password: {{ .Values.database.password | quote }}
