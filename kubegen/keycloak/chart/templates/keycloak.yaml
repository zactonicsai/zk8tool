# Service other components and the Istio gateway use to reach Keycloak.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless service: gives each Keycloak pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
spec:
  serviceName: keycloak-headless
  replicas: {{ .Values.replicas }}
  # Start and stop pods together rather than one at a time.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Production mode. --import-realm loads the files in data/import
          # for realms that do not exist yet.
          args:
            - start
            {{- if .Values.realm.enabled }}
            - --import-realm
            {{- end }}
          env:
            # First admin account (Keycloak 26+ names; created only when no
            # admin exists yet).
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password

            # Database
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Values.database.host | default "keycloak-postgres" | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: db-username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: db-password

            # The one public address Keycloak puts in links and tokens.
            - name: KC_HOSTNAME
              value: {{ .Values.externalUrl | default (printf "https://%s" .Values.hostname) | quote }}
            # TLS ends at the Istio gateway, so Keycloak itself listens on
            # plain HTTP and trusts the gateway's X-Forwarded-* headers.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded

            # Health and metrics on the management port (9000), which is not
            # exposed through the gateway.
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # First start builds Keycloak's configuration and sets up the
          # database, which can take a few minutes: allow up to 10.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.realm.enabled }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- end }}
      {{- if .Values.realm.enabled }}
      volumes:
        - name: realm
          secret:
            secretName: keycloak-realm
      {{- end }}
