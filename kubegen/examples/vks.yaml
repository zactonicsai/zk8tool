# yaml-language-server: $schema=../schema/cluster.schema.yaml
apiVersion: kubegen/v1
provider: vks
name: team-a
kubernetesVersion: "v1.33.1+vmware.1-fips"   # from: kubectl get kr
tags:
  team: a

nodePools:
  - name: workers
    count: 3
  - name: large
    size: guaranteed-xlarge
    autoscaling: {enabled: true, min: 1, max: 5}

vks:
  login:
    method: kubectl-vsphere      # or "none" if you log in yourself (e.g. VCF CLI)
    server: supervisor.example.com
    username: devops@vsphere.local
  namespace: team-a-ns
  clusterClass: builtin-generic-v3.4.0     # from: kubectl get clusterclass -A
  clusterClassNamespace: vmware-system-vks-public
  controlPlaneReplicas: 3
  vmClass: best-effort-medium
  storageClass: vsan-default-storage-policy
  podCidr: 192.168.156.0/20
  serviceCidr: 10.96.0.0/12
  waitTimeout: 45m
