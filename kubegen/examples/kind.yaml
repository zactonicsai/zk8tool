# yaml-language-server: $schema=../schema/cluster.schema.yaml
apiVersion: kubegen/v1
provider: kind
name: dev-local
kubernetesVersion: "1.33.1"

kind:
  controlPlaneNodes: 1
  workerNodes: 2
  ingressReady: true          # maps host ports 80/443 to the control-plane node
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  extraPortMappings:
    - containerPort: 30080
      hostPort: 8080
  waitTimeout: 180s
