# The Istio Gateway: which ports and host names the ingress gateway accepts.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- toYaml .Values.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml (concat .Values.hosts .Values.publicHosts) | nindent 8 }}
      {{- if .Values.gateway.tls.enabled }}
      # Send plain-HTTP visitors to HTTPS.
      tls:
        httpsRedirect: true
      {{- end }}
    {{- if .Values.gateway.tls.enabled }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.gateway.tls.credentialName }}
      hosts:
        {{- toYaml (concat .Values.hosts .Values.publicHosts) | nindent 8 }}
    {{- end }}
