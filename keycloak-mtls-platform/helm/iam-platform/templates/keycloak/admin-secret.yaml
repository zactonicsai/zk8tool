{{- if and .Values.keycloak.enabled .Values.keycloak.admin.create (not .Values.keycloak.admin.existingSecret) }}
{{- $name := include "platform.keycloak.adminSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Bootstrap admin with a random password. The password is generated once:
# upgrades reuse the value stored in the cluster, and the Secret survives
# `helm uninstall` so a reinstall does not lock you out.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ "temp-admin" | b64enc | quote }}
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
{{- end }}
