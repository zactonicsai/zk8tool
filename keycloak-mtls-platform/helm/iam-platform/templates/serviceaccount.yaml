{{- if .Values.serviceAccount.create }}
# One identity for all workloads. They never talk to the Kubernetes API, so
# the token is not mounted; annotate it for Entra Workload ID if a workload
# needs an Azure identity (e.g. password-less database access).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.serviceAccountName" . }}
  labels:
    {{- include "platform.labels" (dict "root" . "component" "platform") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
