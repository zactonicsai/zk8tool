{{- if and .Values.app.enabled .Values.app.ingress.enabled }}
{{- if not .Values.app.ingress.host }}
{{- fail "app.ingress.host is required when app.ingress.enabled is true." }}
{{- end }}
# The backend speaks HTTPS. Tell your controller to re-encrypt with
# app.ingress.annotations and enable session affinity when app.replicas > 1;
# see docs/helm/ingress.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform.app.fullname" . }}
  labels:
    {{- include "platform.labels" (dict "root" . "component" "spring-app") | nindent 4 }}
  {{- with .Values.app.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.app.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.app.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.app.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.app.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform.app.fullname" . }}
                port:
                  name: https
{{- end }}
