{{- if and .Values.app.enabled .Values.app.pdb.enabled (gt (int .Values.app.replicas) 1) }}
{{- $labels := dict "root" . "component" "spring-app" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "platform.app.fullname" . }}
  labels:
    {{- include "platform.labels" $labels | nindent 4 }}
spec:
  minAvailable: {{ .Values.app.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" $labels | nindent 6 }}
{{- end }}
