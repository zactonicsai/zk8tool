# helm unittest suite: NetworkPolicies (default deny + required flows).
suite: network policies
release:
  name: iam
  namespace: iam
templates:
  - keycloak/networkpolicy.yaml
  - app/networkpolicy.yaml
  - tests/networkpolicy.yaml
tests:
  - it: every policy denies by default in both directions
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]

  - it: Keycloak accepts HTTPS only from the app and the test pod
    template: keycloak/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: keycloak
      - equal:
          path: spec.ingress[0]
          value:
            ports:
              - {port: 8443, protocol: TCP}
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: iam-platform
                    app.kubernetes.io/instance: iam
                    app.kubernetes.io/component: spring-app
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: iam-platform
                    app.kubernetes.io/instance: iam
                    app.kubernetes.io/component: test-client

  - it: Keycloak management is reachable only by the test pod
    template: keycloak/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[1].ports
          value:
            - {port: 9000, protocol: TCP}
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: test-client
      - lengthEqual:
          path: spec.ingress[1].from
          count: 1

  - it: Keycloak may only resolve DNS and talk to its peers with the embedded database
    template: keycloak/networkpolicy.yaml
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[0].ports
          value:
            - {port: 53, protocol: UDP}
            - {port: 53, protocol: TCP}

  - it: Keycloak may reach an external database on the vendor's default port
    template: keycloak/networkpolicy.yaml
    set:
      keycloak.database.vendor: postgres
      keycloak.database.host: db.example.com
      keycloak.database.existingSecret: keycloak-db
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[2]
          value:
            ports:
              - {port: 5432, protocol: TCP}

  - it: an explicit database port is used for the egress rule
    template: keycloak/networkpolicy.yaml
    set:
      keycloak.database.vendor: mssql
      keycloak.database.host: db.example.com
      keycloak.database.port: "14330"
      keycloak.database.existingSecret: keycloak-db
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 14330

  - it: extra peers and egress rules are appended for Keycloak
    template: keycloak/networkpolicy.yaml
    set:
      keycloak.networkPolicy.extraIngress:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      keycloak.networkPolicy.extraEgress:
        - ports:
            - {port: 636, protocol: TCP}
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 3
      - equal:
          path: spec.ingress[0].from[2].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress
      - equal:
          path: spec.egress[2].ports[0].port
          value: 636

  - it: allowExternalHttps opens port 8443 to any source but not the management port
    set:
      networkPolicy.allowExternalHttps: true
    asserts:
      - notExists:
          path: spec.ingress[0].from
        template: keycloak/networkpolicy.yaml
      - exists:
          path: spec.ingress[1].from
        template: keycloak/networkpolicy.yaml
      - notExists:
          path: spec.ingress[0].from
        template: app/networkpolicy.yaml
      - exists:
          path: spec.ingress[1].from
        template: app/networkpolicy.yaml

  - it: the app may only resolve DNS and call Keycloak
    template: app/networkpolicy.yaml
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[1]
          value:
            ports:
              - {port: 8443, protocol: TCP}
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: iam-platform
                    app.kubernetes.io/instance: iam
                    app.kubernetes.io/component: keycloak

  - it: the app accepts the test pod on https and management
    template: app/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: test-client
      - equal:
          path: spec.ingress[1].ports
          value:
            - {port: 9443, protocol: TCP}

  - it: the test pod accepts nothing and reaches only Keycloak and the app
    template: tests/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress
          value: []
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[1].ports
          value:
            - {port: 8443, protocol: TCP}
            - {port: 9000, protocol: TCP}
      - equal:
          path: spec.egress[2].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: spring-app

  - it: no policies are rendered when network policies are disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
